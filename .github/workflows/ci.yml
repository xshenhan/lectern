# Lectern tests: typecheck and unit tests on macOS and Windows; on Linux (xvfb)
# the private-information guard, a production dependency audit and the whole
# offline suite through `npm run test:all` (typecheck, unit tests, build, every
# desktop e2e); optionally builds the installers, launches the packaged app and
# uploads artifacts on each platform. Nothing here talks to a real model or SSH host.
#
# Called by the pull request and release workflows, and available for manual runs.
name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: Tag, branch or commit to test (empty for the triggering ref)
        type: string
        default: ''
      package:
        description: Also build installers and launch the packaged app on every platform
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or commit to test (empty for the selected branch)
        type: string
        default: ''
      package:
        description: Also build installers and launch the packaged app on every platform
        type: boolean
        default: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  # Claude Code used by the e2e that drive the real CLI against a loopback fake model
  # (claude-code-compat.yml covers the other releases, including latest and stable).
  CLAUDE_CODE_VERSION: '2.1.329'
  LECTERN_LOCALE: zh-CN

jobs:
  check:
    # Linux runs the same typecheck and unit tests inside `npm run test:all` below.
    name: Typecheck and unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Unit tests never start Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests
        run: npm test

  e2e-linux:
    name: Full test suite (Linux, xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install tmux, xvfb, OpenSSH server and Pillow (workspace image thumbnails)
        run: sudo apt-get update && sudo apt-get install -y tmux xvfb openssh-server python3-pil
      - name: Let Electron use its sandbox (Ubuntu 24.04 restricts user namespaces)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm ci
      - name: Private information guard
        run: node scripts/check-private-info.mjs
      - name: Audit production dependencies (reported, never blocks a release)
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit reports high-severity advisories in production dependencies"
      - name: Install Claude Code (no model requests; e2e point it at a loopback fake)
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Typecheck, unit tests, build and every offline desktop e2e
        run: npm run test:all -- --retries 1
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-all-logs
          path: test-results/test-all/
          if-no-files-found: ignore
          overwrite: true
      - name: Upload screenshots and diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux
          path: |
            test-results/
            !test-results/package/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  package:
    # release.yml turns this off: its own build job packages and launches every platform.
    if: inputs.package
    name: Installers (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            target: --linux
            arch: x64
          - os: macos-latest
            platform: mac-arm64
            target: --mac
            arch: arm64
          - os: macos-15-intel
            platform: mac-x64
            target: --mac
            arch: x64
          - os: windows-latest
            platform: windows-x64
            target: --win
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm ci
      - run: npm run build
      - name: Build the release installers without release credentials
        shell: bash
        env:
          LECTERN_PACKAGE_OUT: test-results/package
        run: bash scripts/ci-package.sh ${{ matrix.target }} --${{ matrix.arch }}
      - name: Verify installer checksums
        run: node scripts/release-checksums.mjs test-results/package/assets
      - name: Verify macOS disk image
        if: runner.os == 'macOS'
        id: disk-image
        shell: bash
        run: |
          images=(test-results/package/assets/*-mac-${{ matrix.arch }}.dmg)
          test "${#images[@]}" -eq 1
          hdiutil verify "${images[0]}"
          printf 'path=%s\nname=%s\n' "${images[0]}" "${images[0]##*/}" >> "$GITHUB_OUTPUT"
      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        id: dmg
        uses: actions/upload-artifact@v7
        with:
          # Raw uploads use the filename, and overwrite deletes by the explicit name.
          name: ${{ steps.disk-image.outputs.name }}
          path: ${{ steps.disk-image.outputs.path }}
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Link the DMG in the run summary
        if: runner.os == 'macOS'
        shell: bash
        env:
          DMG_URL: ${{ steps.dmg.outputs.artifact-url }}
        run: printf '[Download the macOS %s DMG](%s)\n' '${{ matrix.arch }}' "$DMG_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload other installers and checksums
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.platform }}
          path: |
            test-results/package/assets/
            !test-results/package/assets/*.dmg
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 30
      - name: Launch the packaged app
        shell: bash
        env:
          LECTERN_DMG: ${{ steps.disk-image.outputs.path }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s '-screen 0 1600x1000x24' node scripts/smoke-package.mjs test-results/package
          elif [ "$RUNNER_OS" = macOS ]; then
            mount_dir=$(mktemp -d "${RUNNER_TEMP}/lectern-dmg.XXXXXX")
            trap 'hdiutil detach "$mount_dir" -quiet || true; rmdir "$mount_dir"' EXIT
            hdiutil attach "${LECTERN_DMG}" -readonly -nobrowse -quiet -mountpoint "$mount_dir"
            codesign --verify --deep --strict "$mount_dir/Lectern.app"
            node scripts/smoke-package.mjs "$mount_dir/Lectern.app/Contents/MacOS/Lectern"
          else
            node scripts/smoke-package.mjs test-results/package
          fi
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-smoke-${{ matrix.platform }}
          path: test-results/*.png
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
